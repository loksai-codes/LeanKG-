# Rule-only relation test sentences (hand-written). Each expectation is
# "head > RELATION > tail" with optional flags: neg, hedge, complex, candidate.
# Without "candidate"/"complex" the triple must be accepted (or negative when "neg").
en:
  - {text: Chronic stress increases the risk of insomnia., expect: [Chronic stress > INCREASES_RISK_OF > insomnia]}
  - {text: Work stress causes burnout., expect: [Work stress > INCREASES_RISK_OF > burnout]}
  - {text: Insomnia is often caused by shift work., expect: [shift work > INCREASES_RISK_OF > Insomnia]}
  - {text: Depression causes fatigue and loss of appetite., expect: [Depression > INCREASES_RISK_OF > fatigue, Depression > INCREASES_RISK_OF > loss of appetite]}
  - {text: Regular exercise reduces anxiety in adults., expect: [exercise > REDUCES > anxiety]}
  - {text: Cognitive behavioral therapy treats insomnia., expect: [Cognitive behavioral therapy > TREATS > insomnia]}
  - {text: Mindfulness meditation lowers cortisol levels., expect: [Mindfulness meditation > REDUCES > cortisol levels]}
  - {text: Yoga did not reduce blood pressure., expect: [Yoga > REDUCES > blood pressure | neg]}
  - {text: Social isolation may increase the risk of depression., expect: [Social isolation > INCREASES_RISK_OF > depression | hedge]}
  - {text: Work stress is associated with burnout., expect: [Work stress > ASSOCIATED_WITH > burnout]}
  - {text: Stress was measured with the Perceived Stress Scale., expect: [Stress > MEASURED_BY > Perceived Stress Scale]}
  - {text: Fatigue is a common symptom of depression., expect: [depression > HAS_SYMPTOM > Fatigue]}
  - {text: Shift work leads to sleep disorder., expect: [Shift work > INCREASES_RISK_OF > sleep disorder]}
  - {text: Exercise alleviates symptoms of depression., expect: [Exercise > REDUCES > depression]}
  - {text: Caregiver burden increases the risk of depression., expect: [Caregiver burden > INCREASES_RISK_OF > depression]}
  - {text: Exercise did not reduce fatigue., expect: [Exercise > REDUCES > fatigue | neg]}
  - {text: CBT may reduce insomnia., expect: [CBT > REDUCES > insomnia | hedge]}
  - {text: Sleep deprivation is associated with irritability., expect: [Sleep deprivation > ASSOCIATED_WITH > irritability]}
  - {text: Burnout was assessed with the Maslach Burnout Inventory., expect: [Burnout > MEASURED_BY > Maslach Burnout Inventory]}
  - {text: Mindfulness meditation alleviates anxiety and rumination., expect: [Mindfulness meditation > REDUCES > anxiety, Mindfulness meditation > REDUCES > rumination]}
  - {text: Antidepressants treat depression in adults., expect: [Antidepressants > TREATS > depression]}
  - {text: Headache is a sign of hypertension., expect: [hypertension > HAS_SYMPTOM > Headache]}
  - {text: Financial strain contributes to anxiety disorder., expect: [Financial strain > INCREASES_RISK_OF > anxiety disorder]}
  - {text: It cannot be ruled out that shift work causes hypertension., expect: [shift work > INCREASES_RISK_OF > hypertension | complex]}
