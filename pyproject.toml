[project]
name = "leankg"
version = "0.1.0.dev0"
description = "Turn English and Japanese documents into a Neo4j knowledge graph: classic NLP first, a little LLM for the hard cases."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Loksai Palyam" }]
keywords = ["knowledge-graph", "nlp", "neo4j", "japanese", "spacy", "information-extraction", "graphrag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Natural Language :: Japanese",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rapidfuzz>=3.9",
  "spacy>=3.8.16,<3.9",
  "pyahocorasick>=2.1",
  "networkx>=3.2",
  "pypdf>=4.0",
  "trafilatura>=1.12",
  "rdflib>=7.0",
]

[project.optional-dependencies]
# English medical NLP. scispaCy pins spaCy <3.9 and numpy <2 and needs Python <3.13.
med = ["scispacy>=0.6.2; python_version < '3.13'", "negspacy>=1.1"]
# Japanese: GiNZA (SudachiPy) + kana conversion.
ja = ["ginza>=5.3", "ja-ginza>=5.3", "jaconv>=0.4"]
gliner = ["gliner>=0.2.20"]
embed = ["sentence-transformers>=3.0"]
neo4j = ["neo4j>=5.20"]
groq = ["groq>=0.30"]
ollama = ["ollama>=0.4"]
# Convenience bundle for development without the heavy torch-based extras.
dev = ["leankg[ja,neo4j,groq,ollama]"]

[project.scripts]
leankg = "leankg.cli:app"

[project.urls]
Homepage = "https://github.com/OWNER/leankg"
Documentation = "https://OWNER.github.io/leankg"
Issues = "https://github.com/OWNER/leankg/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
  "en-core-web-sm",
]
docs = ["mkdocs-material>=9.5"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leankg"]

[tool.hatch.build.targets.wheel.force-include]
"domains" = "leankg/_domains"

[tool.hatch.build.targets.sdist]
include = ["src/leankg", "domains", "tests", "README.md", "LICENSE", "CHANGELOG.md", "leankg.toml"]
exclude = ["domains/**/data", "**/__pycache__"]

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
# RUF001-003: Japanese text legitimately contains full-width characters.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["leankg"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "ahocorasick", "ginza", "ginza.*", "jaconv", "gliner", "gliner.*", "negspacy", "negspacy.*",
  "scispacy", "scispacy.*", "sentence_transformers", "sentence_transformers.*", "trafilatura",
  "trafilatura.*", "networkx", "networkx.*", "ollama", "ollama.*", "spacy", "spacy.*",
  "rdflib", "rdflib.*", "pypdf", "pypdf.*", "neo4j", "neo4j.*", "groq", "groq.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
  "integration: needs a running Neo4j and/or GROQ_API_KEY (run with -m integration)",
  "slow: loads large models",
]
filterwarnings = ["ignore::DeprecationWarning:spacy.*", "ignore::DeprecationWarning:thinc.*"]

[tool.coverage.run]
source = ["leankg"]
branch = true
