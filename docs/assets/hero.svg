<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">LeanKG</title>
  <desc id="d">Animated banner: documents in English and Japanese become a knowledge graph. Rules first, a little LLM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
      .tag { font-size: 26px; fill: #e2e8f0; opacity: 0; }
      .en { animation: swapA 8s infinite; }
      .ja { animation: swapB 8s infinite; }
      @keyframes swapA { 0%,5% {opacity:0; transform: translateY(8px);} 10%,42% {opacity:1; transform: translateY(0);} 50%,100% {opacity:0; transform: translateY(-8px);} }
      @keyframes swapB { 0%,50% {opacity:0; transform: translateY(8px);} 58%,92% {opacity:1; transform: translateY(0);} 100% {opacity:0; transform: translateY(-8px);} }
      .edge { fill: none; stroke: #7dd3fc; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 8s infinite; }
      .edge.neg { stroke: #f87171; stroke-dasharray: 6 6; animation: fadein 8s infinite; }
      .e1 { animation-delay: 0.4s; } .e2 { animation-delay: 1.0s; } .e3 { animation-delay: 1.6s; }
      .e4 { animation-delay: 2.2s; } .e5 { animation-delay: 2.8s; }
      @keyframes draw { 0% {stroke-dashoffset: 220;} 25%,85% {stroke-dashoffset: 0;} 100% {stroke-dashoffset: 220;} }
      @keyframes fadein { 0%,30% {opacity:0;} 40%,85% {opacity:1;} 100% {opacity:0;} }
      .node { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: .4s; } .n3 { animation-delay: .8s; } .n4 { animation-delay: 1.2s; } .n5 { animation-delay: 1.6s; } .n6 { animation-delay: 2s; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      .lbl { font-size: 13px; fill: #cbd5e1; }
      .chip { font-size: 13px; fill: #0b1020; font-weight: 600; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tag.en, .edge { opacity: 1; stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="960" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="760" cy="150" r="170" fill="url(#glow)"/>

  <!-- left: title + taglines -->
  <text x="48" y="112" class="sans" font-size="76" font-weight="800" fill="url(#title)">LeanKG</text>
  <text x="50" y="158" class="sans tag en">Documents → Knowledge Graph</text>
  <text x="50" y="158" class="sans tag ja">文書 → ナレッジグラフ</text>
  <text x="50" y="196" class="sans" font-size="16" fill="#94a3b8">rules first · a little LLM · English &amp; 日本語 · Neo4j</text>

  <!-- chips -->
  <g class="sans">
    <rect x="50" y="222" width="122" height="30" rx="15" fill="#7dd3fc"/>
    <text x="111" y="242" text-anchor="middle" class="chip">6–17% → LLM</text>
    <rect x="182" y="222" width="148" height="30" rx="15" fill="#a78bfa"/>
    <text x="256" y="242" text-anchor="middle" class="chip">2nd run: $0 cache</text>
    <rect x="340" y="222" width="150" height="30" rx="15" fill="#f472b6"/>
    <text x="415" y="242" text-anchor="middle" class="chip">provenance on all</text>
  </g>

  <!-- right: knowledge graph -->
  <g class="sans">
    <path class="edge e1" d="M640 92 Q 700 70 770 92"/>
    <path class="edge e2" d="M640 92 Q 650 150 660 205"/>
    <path class="edge e3" d="M770 92 Q 840 120 880 170"/>
    <path class="edge e4" d="M660 205 Q 760 230 880 170"/>
    <path class="edge e5" d="M770 92 Q 765 150 770 210"/>
    <path class="edge neg" d="M660 205 Q 715 220 770 210"/>

    <g class="node n1"><circle cx="640" cy="92" r="20" fill="#0ea5e9"/></g>
    <g class="node n2"><circle cx="770" cy="92" r="20" fill="#8b5cf6"/></g>
    <g class="node n3"><circle cx="660" cy="205" r="20" fill="#22c55e"/></g>
    <g class="node n4"><circle cx="880" cy="170" r="20" fill="#f59e0b"/></g>
    <g class="node n5"><circle cx="770" cy="210" r="16" fill="#ec4899"/></g>

    <text x="640" y="60" text-anchor="middle" class="lbl">ストレス / stress</text>
    <text x="770" y="60" text-anchor="middle" class="lbl">不眠 / insomnia</text>
    <text x="640" y="245" text-anchor="middle" class="lbl">運動 / exercise</text>
    <text x="905" y="208" text-anchor="middle" class="lbl">疲労 / fatigue</text>
    <text x="770" y="246" text-anchor="middle" class="lbl">血圧</text>
    <text x="706" y="270" class="lbl" fill="#f87171" font-size="11">negated: 〜しなかった</text>
  </g>
</svg>
