<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">leankg build in a terminal</title>
  <desc id="d">Animated terminal: leankg build runs with the Groq fallback, prints a per-language report, and a second run is served entirely from cache for zero cost.</desc>
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "Cascadia Code", Menlo, Consolas, "Noto Sans Mono CJK JP", monospace; font-size: 14px; white-space: pre; }
      .dim { fill: #64748b; } .txt { fill: #e2e8f0; } .ok { fill: #4ade80; } .hi { fill: #fbbf24; } .cy { fill: #7dd3fc; } .pk { fill: #f472b6; }
      .line { opacity: 0; animation: show 14s infinite; }
      .l1 { animation-delay: 1.6s; } .l2 { animation-delay: 1.9s; } .l3 { animation-delay: 2.2s; }
      .l4 { animation-delay: 2.5s; } .l5 { animation-delay: 2.8s; } .l6 { animation-delay: 3.1s; }
      .l7 { animation-delay: 6.0s; } .l8 { animation-delay: 7.4s; } .l9 { animation-delay: 7.7s; }
      @keyframes show { 0% {opacity:0;} 1% {opacity:1;} 90% {opacity:1;} 96%,100% {opacity:0;} }
      .type1 { clip-path: inset(0 100% 0 0); animation: type1 14s steps(46) infinite; }
      @keyframes type1 { 0% {clip-path: inset(0 100% 0 0);} 9% {clip-path: inset(0 0 0 0);} 90% {clip-path: inset(0 0 0 0);} 96%,100% {clip-path: inset(0 100% 0 0);} }
      .type2 { clip-path: inset(0 100% 0 0); animation: type2 14s steps(46) infinite; animation-delay: 4.4s; }
      @keyframes type2 { 0% {clip-path: inset(0 100% 0 0);} 9% {clip-path: inset(0 0 0 0);} 58% {clip-path: inset(0 0 0 0);} 62%,100% {clip-path: inset(0 100% 0 0);} }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .badge { opacity: 0; animation: pop 14s infinite; animation-delay: 8.0s; transform-box: fill-box; transform-origin: center; }
      @keyframes pop { 0% {opacity:0; transform: scale(.6);} 3% {opacity:1; transform: scale(1.08);} 5% {transform: scale(1);} 40% {opacity:1;} 45%,100% {opacity:0;} }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .line, .badge { opacity: 1; } .type1, .type2 { clip-path: none; } }
    </style>
  </defs>

  <rect width="960" height="360" rx="16" fill="#0f172a"/>
  <rect width="960" height="36" rx="16" fill="#1e293b"/>
  <rect y="20" width="960" height="16" fill="#1e293b"/>
  <circle cx="24" cy="18" r="6" fill="#f87171"/><circle cx="44" cy="18" r="6" fill="#fbbf24"/><circle cx="64" cy="18" r="6" fill="#4ade80"/>
  <text x="480" y="23" text-anchor="middle" class="mono dim" font-size="12">leankg — bash</text>

  <g class="mono">
    <text x="24" y="70" class="type1"><tspan class="ok">$</tspan><tspan class="txt"> leankg build examples --domain manufacturing --llm groq</tspan></text>

    <text x="24" y="100" class="line l1 cy">leankg run — domain=manufacturing llm=groq (openai/gpt-oss-20b)</text>
    <text x="24" y="124" class="line l2 dim">lang  docs  sents  mentions  entities  triples  hard%  llm%  cache%    cost$</text>
    <text x="24" y="146" class="line l3 txt">  en     7     30        36        30       18   13.3  13.3     0.0   0.0004</text>
    <text x="24" y="168" class="line l4 txt">  ja     2     22        29        26       10    0.0   0.0     0.0   0.0000</text>
    <text x="24" y="190" class="line l5 txt"> all     9     52        65        33       18    <tspan class="hi">7.7   7.7</tspan>     0.0   0.0004</text>
    <text x="24" y="214" class="line l6 dim">duration 5.88s · llm requests 1 · cost/1k docs $0.0405</text>

    <text x="24" y="252" class="type2"><tspan class="ok">$</tspan><tspan class="txt"> leankg build examples --domain manufacturing --llm groq</tspan></text>
    <text x="24" y="282" class="line l8 txt"> all     9     52        65        33       18    7.7   7.7   <tspan class="ok">100.0   0.0000</tspan></text>
    <text x="24" y="306" class="line l9 dim">duration 4.69s · <tspan class="ok">llm requests 0</tspan> · cost/1k docs <tspan class="ok">$0.0000</tspan></text>
    <rect x="24" y="322" width="9" height="16" fill="#e2e8f0" class="cursor"/>
  </g>

  <g class="badge">
    <rect x="690" y="262" width="240" height="56" rx="14" fill="#4ade80"/>
    <text x="810" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#052e16">2nd run: 100% cache</text>
    <text x="810" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#052e16">0 LLM requests · $0</text>
  </g>
</svg>
