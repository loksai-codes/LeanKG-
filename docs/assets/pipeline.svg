<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="t d">
  <title id="t">leankg pipeline</title>
  <desc id="d">Animated pipeline: sentences flow through ingest, entities, linking, relations and validation. Confident results go straight to the graph; only hard cases branch to the LLM.</desc>
  <defs>
    <style>
      .sans { font-family: "Segoe UI", "Helvetica Neue", Arial, "Noto Sans JP", sans-serif; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; animation: lit 6s infinite; }
      .b1 { animation-delay: .0s; } .b2 { animation-delay: .6s; } .b3 { animation-delay: 1.2s; } .b4 { animation-delay: 1.8s; } .b5 { animation-delay: 2.4s; } .b6 { animation-delay: 3.0s; }
      @keyframes lit { 0%,100% { stroke: #334155; fill: #1e293b; } 6% { stroke: #7dd3fc; fill: #0c4a6e; } 16% { stroke: #334155; fill: #1e293b; } }
      .name { font-size: 15px; font-weight: 600; fill: #f1f5f9; }
      .sub { font-size: 11.5px; fill: #94a3b8; }
      .track { stroke: #334155; stroke-width: 3; fill: none; }
      .flowg { stroke: #4ade80; stroke-width: 3; fill: none; stroke-dasharray: 8 10; animation: dash 1s linear infinite; }
      .flowl { stroke: #fbbf24; stroke-width: 3; fill: none; stroke-dasharray: 8 10; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -18; } }
      .out { font-size: 15px; font-weight: 700; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <path id="main" d="M 30 110 L 838 110"/>
    <path id="hard" d="M 30 110 L 744 110 Q 790 110 800 190 L 838 214"/>
  </defs>

  <rect width="960" height="280" rx="18" fill="#0f172a"/>
  <path class="track" d="M 30 110 L 838 110"/>

  <g class="sans">
    <rect class="box b1" x="20"  y="80" width="118" height="60" rx="10"/>
    <text x="79"  y="106" text-anchor="middle" class="name">Ingest</text>
    <text x="79"  y="124" text-anchor="middle" class="sub">lang per chunk</text>

    <rect class="box b2" x="152" y="80" width="118" height="60" rx="10"/>
    <text x="211" y="106" text-anchor="middle" class="name">Entities</text>
    <text x="211" y="124" text-anchor="middle" class="sub">dict · regex · NER</text>

    <rect class="box b3" x="284" y="80" width="118" height="60" rx="10"/>
    <text x="343" y="106" text-anchor="middle" class="name">Linking</text>
    <text x="343" y="124" text-anchor="middle" class="sub">ストレス = stress</text>

    <rect class="box b4" x="416" y="80" width="118" height="60" rx="10"/>
    <text x="475" y="106" text-anchor="middle" class="name">Relations</text>
    <text x="475" y="124" text-anchor="middle" class="sub">GiNZA patterns</text>

    <rect class="box b5" x="548" y="80" width="118" height="60" rx="10"/>
    <text x="607" y="106" text-anchor="middle" class="name">Negation</text>
    <text x="607" y="124" text-anchor="middle" class="sub">〜しなかった</text>

    <rect class="box b6" x="680" y="80" width="118" height="60" rx="10"/>
    <text x="739" y="106" text-anchor="middle" class="name">Validate</text>
    <text x="739" y="124" text-anchor="middle" class="sub">schema · score</text>

    <!-- outputs -->
    <path class="flowg" d="M 798 110 L 840 110"/>
    <rect x="840" y="84" width="104" height="52" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="892" y="108" text-anchor="middle" class="out" fill="#4ade80">Graph</text>
    <text x="892" y="126" text-anchor="middle" class="sub" fill="#bbf7d0">Neo4j · JSON</text>

    <path class="flowl" d="M 760 140 Q 780 214 838 214"/>
    <rect x="840" y="190" width="104" height="52" rx="12" fill="#451a03" stroke="#fbbf24" stroke-width="2"/>
    <text x="892" y="214" text-anchor="middle" class="out" fill="#fbbf24">LLM</text>
    <text x="892" y="232" text-anchor="middle" class="sub" fill="#fde68a">hard cases only</text>

    <text x="30" y="40" class="name" font-size="18">Rules first. The LLM only sees what rules can't settle.</text>
    <text x="30" y="62" class="sub" font-size="13">On the sample data 83–94% of sentences never reach the LLM · answers are cached, deduplicated and budget-capped</text>
    <text x="30" y="232" class="sub" font-size="13">● green: confident rule result</text>
    <text x="30" y="252" class="sub" font-size="13" fill="#fbbf24">● amber: hard case (ambiguous, low confidence, tricky negation)</text>
  </g>

  <!-- moving sentences -->
  <circle r="7" fill="#4ade80">
    <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#main"/></animateMotion>
  </circle>
  <circle r="7" fill="#4ade80" opacity="0.8">
    <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#main"/></animateMotion>
  </circle>
  <circle r="7" fill="#fbbf24">
    <animateMotion dur="4.8s" begin="2.0s" repeatCount="indefinite"><mpath href="#hard"/></animateMotion>
  </circle>
</svg>
